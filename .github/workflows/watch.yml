name: Watch for new dogs
on:
  schedule:
    - cron: "17 * * * *"   # hourly
  workflow_dispatch:
    inputs:
      test:
        description: "Send test notification"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send test notification
        if: ${{ inputs.test }}
        run: |
          curl -fsS -H "Title: Test from Wright-Way watcher" -H "Tags: dog" \
            -d "Phone alerts are working! You'll get one like this when a new dog is posted." \
            "https://ntfy.sh/$NTFY_TOPIC"
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - run: python3 watch.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Save seen list
        run: |
          git config user.name "dog-watch-bot"
          git config user.email "dog-watch-bot@users.noreply.github.com"
          git add seen.json new_dogs.log
          git diff --cached --quiet || git commit -m "Update seen dogs"
          git push
