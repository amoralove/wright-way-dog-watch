name: Watch for new dogs
on:
  schedule:
    - cron: "0 14 * * *"    # daily "still watching" check-in (9 AM Central)
  workflow_dispatch:
    inputs:
      test:
        description: "Send test notification"
        type: boolean
        default: false
      heartbeat:
        description: "Send the daily still-watching check-in"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: watch
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send test notification
        if: ${{ inputs.test }}
        run: |
          curl -fsS -H "Title: Test from Wright-Way watcher" -H "Tags: dog" \
            -d "Phone alerts are working! You'll get one like this when a new dog is posted." \
            "https://ntfy.sh/$NTFY_TOPIC"
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - run: python3 watch.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          HEARTBEAT: ${{ github.event.schedule == '0 14 * * *' || inputs.heartbeat == true }}
      - name: Save seen list
        run: |
          git config user.name "dog-watch-bot"
          git config user.email "dog-watch-bot@users.noreply.github.com"
          git add seen.json new_dogs.log
          git diff --cached --quiet || git commit -m "Update seen dogs"
          git pull --rebase
          git push
