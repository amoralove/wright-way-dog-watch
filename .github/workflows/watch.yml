name: Watch for new dogs
on:
  schedule:
    - cron: "17 * * * *"   # hourly
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 watch.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Save seen list
        run: |
          git config user.name "dog-watch-bot"
          git config user.email "dog-watch-bot@users.noreply.github.com"
          git add seen.json new_dogs.log
          git diff --cached --quiet || git commit -m "Update seen dogs"
          git push
